name: Build APK

# Builds an installable APK on every push (any branch) and publishes it as a GitHub Release,
# so it can be downloaded straight to the phone. Signing:
#   - if the KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD secrets exist, the
#     APK is signed with that stable key (later builds install as in-place upgrades);
#   - otherwise it is signed with the runner's throwaway debug key (installable, but each new
#     build must be uninstalled/reinstalled because the key changes).
on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'gradle.properties'
      - '.github/workflows/apk.yml'

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8 -XX:+UseG1GC"

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Decode signing keystore (if configured)
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "Signing with the configured release key."
          else
            echo "::warning::No KEYSTORE_BASE64 secret; signing with a throwaway debug key."
          fi

      - name: Build release APK
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          [ -z "$KEYSTORE_PASSWORD" ] && unset KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -PversionCode="$((1000 + GITHUB_RUN_NUMBER))" \
            -PversionName="1.0.${GITHUB_RUN_NUMBER}-ai"

      - name: Rename APK
        id: apk
        shell: bash
        run: |
          NAME="SwiftSlate-AI-${GITHUB_RUN_NUMBER}.apk"
          mv app/build/outputs/apk/release/app-release.apk "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          rm -f "$RUNNER_TEMP/release.keystore"

      - name: Upload APK artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.name }}
          retention-days: 30

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APK: ${{ steps.apk.outputs.name }}
        run: |
          TAG="apk-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" "$APK" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "SwiftSlate AI build ${GITHUB_RUN_NUMBER} (${GITHUB_REF_NAME})" \
            --notes "Branch: ${GITHUB_REF_NAME}  Commit: ${GITHUB_SHA::7}. Download the .apk below and install it on the phone." \
            --latest
